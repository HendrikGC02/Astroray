# pkg55-B' Session N+2 — CPU↔GPU wavefront threshold pinning
#
# Spec: .astroray_plan/packages/pkg55-wavefront-soa-refactor.md §4.2 GATE-THRESHOLDS-PINNED
# Design rationale: PR #296 §4.1, §4.2
#
# This file defines the two-tier gate thresholds for wavefront CUDA port:
#   1. CPU oracle ↔ CPU wavefront: exact bit-identity (enforced by existing tests)
#   2. CPU wavefront ↔ CUDA wavefront: ULP-bounded + p99.9 + SSIM (this file)
#
# Structure:
#   - per_stage: thresholds for each wavefront stage boundary
#   - final_image: whole-image SSIM threshold
#
# Measurement protocol (Session N+2 → N+3 handoff):
#   - CPU↔CPU baseline measured NOW (origin/main, no CUDA changes)
#   - CPU↔GPU thresholds use conservative placeholders until Session N+3
#     first CUDA kernel port, at which point the actual measured values
#     replace these placeholders.
#
# Rationale for bounded (not exact) CPU↔GPU gates:
#   - nvcc FMA fusion differs from host SSE2
#   - CUDA sinf/expf/__fdividef are not IEEE-correctly-rounded
#   - PTX intermediate rounding differs from SSE2
#   - Exact bit-identity across toolchains is physically impossible
#   - The gate's job is LOCALIZATION (which stage widened), not exact equality

# Baseline: CPU oracle ↔ CPU wavefront (Session 2c-N+1, origin/main)
# Expected: exact 0.0 / 0 / 1.0 (bit-identity by shared-kernel construction)
cpu_to_cpu_baseline:
  max_abs_diff: 0.0
  total_diverging_fields: 0
  ssim: 1.0
  scene: "session_n1_envmap_cornell"
  resolution: "16x16"
  spp: 1
  seed: 424242
  measured_on: "origin/main"
  measured_date: "2026-05-21"

# CPU wavefront ↔ CUDA wavefront thresholds (Sessions N+2..M)
# Structure: per-stage thresholds + final image SSIM
cpu_to_gpu_thresholds:
  # PostInit: primary ray generation + wavelength sampling
  # ULP bound applies to the GEOMETRY fields only (ray_origin, ray_direction):
  # camera ray math, no transcendentals beyond normalize. The `lambdas` field
  # is governed by p99_9_relative_error below, NOT max_ulp (pkg238, see note).
  # MEASURED 2026-05-23 on RTX 5070 Ti, CUDA 12.x, MSVC after RNG+hero fixes:
  # geometry max ULP = 2. Pinned at 4 (2 measured + 2× headroom).
  PostInit:
    max_ulp: 4
    ulp_fields: ["ray_origin", "ray_direction"]
    fields: ["ray_origin", "ray_direction", "lambdas"]
    p99_9_relative_error: 1.0e-5
    note: "Pinned 2026-05-23 (PR #349). Geometry (ray_origin/ray_direction) ULP=2, pinned at 4 with 2x headroom. pkg238 (2026-09-07): `lambdas` is EXCLUDED from the ULP bound and governed by p99_9_relative_error instead. pkg206 switched the default primary-path wavelength sampler to sampleImportance, which inverts a logistic CDF with std::log/std::exp (CPU, spectrum.cpp) vs logf/expf (GPU, stage_init.cu). Device transcendentals are not IEEE-correctly-rounded, so lambdas legitimately drifts. MEASURED 2026-09-07 on RTX 5070 Ti (session_n1_envmap_cornell 16x16, seed 424242, 256 rows): ULP ray_origin=0, ray_direction=2, lambdas=13; lambdas p99.9 rel-err=4.89e-7 (max abs 7.9e-4 nm over 362-825 nm), well under the 1.0e-5 bound. Geometry-only ULP stays 2. The original 4-ULP pin assumed 'geometry-only, no transcendentals'; pkg206 invalidated that for lambdas. Mirrors PostShade, which carries no max_ulp for the same reason."

  # PostIntersect: BVH traversal + hit record
  # Geometry-only on valid-hit rows (Möller-Trumbore, ray.at, normal interp).
  # MEASURED 2026-05-23: max raw-int ULP = 32 across the 7 geometry fields
  # (143 valid-hit rows from 256). Diagnostic localized the drift as clean
  # FMA-fusion across 3 reinforcing sources: Möller-Trumbore dot() fusion,
  # ray.at() multiply-add fusion, and the triangle-normal renormalize chain
  # `(n0*w + n1*u + n2*v).normalized()` even when n0==n1==n2. None of those
  # is a single dominant op; max absolute delta is 7.2e-7 and max relative
  # error is 2.3e-6.
  # Pinned at 64 (32 measured + 2× headroom). A future regression above 64
  # is a real numerical change worth investigating.
  # Optional tighten path filed as pkg55-followup-triangle-normal-shortcut:
  # skip the normalize chain when scene_upload didn't emit per-vertex normals
  # (the n0==n1==n2 case at scene_upload.cu:272-278), which would tighten
  # hit_normal toward ~5 ULP and let the gate drop to ~16.
  PostIntersect:
    max_ulp: 64
    fields: ["hit_t", "hit_point", "hit_normal", "hit_material"]
    p99_9_relative_error: 1.0e-5
    note: "Pinned 2026-05-23 (PR #349). Measured raw-int ULP=32, clean FMA-fusion drift across 7 geometry fields. See diagnostic in standup §ESCALATION 1 and pkg55-followup-triangle-normal-shortcut spec."

  # PostShade: BSDF sampling (involves transcendentals: sin/cos/exp/log/pow)
  # No ULP bound (transcendentals involved). Use p99.9 relative-error distribution.
  PostShade:
    # No max_ulp — transcendentals make ULP comparisons meaningless
    # Conservative placeholder: 1e-4 (~0.01% relative error at p99.9)
    p99_9_relative_error: 1.0e-4
    fields: ["ray_origin", "ray_direction", "throughput", "wasSpecular"]
    note: "BSDF stage with transcendentals. p99.9 placeholder (1e-4 = 0.01%) to be measured in Session N+3."

  # PostLightSample: NEE shadow ray + MIS weight (involves div/sqrt/pow)
  # MEASURED 2026-05-24 on RTX 5070 Ti after Session N+4 part 2 snapshot-semantics alignment:
  # p99.9 = 2.211559e-06 on common deterministic fields (ray_origin=shading point, lambdas).
  # Pinned at 3.5e-06 (1.5× measured, Session N+3 convention).
  PostLightSample:
    p99_9_relative_error: 3.5e-06
    fields: ["ray_origin", "lambdas"]
    note: "Pinned 2026-05-24 (Session N+4 part 2). Measured p99.9=2.21e-06 after aligning CPU/GPU snapshot capture to both use shading point (rec.point / hitBufs.hit_point_*). NEE-specific fields (nee_contribution, nee_*_pdf, mis_weight) are TODO placeholders and not compared."

  # PostRR: Russian roulette + radiance accumulation (div/comparison)
  # MEASURED 2026-05-24: p99.9 = 0.0 (no bounce-0 RR rows on Session N+1 scene at max_depth=8).
  # Pinned conservatively at 3.5e-06 (match PostLightSample; will tighten when RR rows exist).
  PostRR:
    p99_9_relative_error: 3.5e-06
    fields: ["ray_origin", "lambdas"]
    note: "Pinned 2026-05-24 (Session N+4 part 2). Measured p99.9=0.0 (no RR rows at bounce 0 on session_n1_envmap_cornell). Conservative bound matches PostLightSample. RR-specific fields (rr_prob, rr_survived) are TODO placeholders and not compared."

  # PostNEE_MIS: shade-time MIS (power heuristic). pkg55-C2 audit gate.
  # Two tiers:
  #   Tier 1 (exact) CPU-wavefront <-> CPU-reference: the MIS triple
  #     (nee_light_pdf, nee_bsdf_pdf_at_dir, nee_mis_weight) is bit-identical by
  #     shared-kernel construction, compared at snapshot_diff.cpp:123-128 (0.0).
  #   Tier 2 (formula parity) both sides: |wt - power_heuristic(lightPdf, bsdfPdf)|
  #     <= power_heuristic_tol, with the identical Veach-1997 formula + 1e-8 guard.
  # Raw MIS pdf VALUES are deliberately NOT compared CPU<->GPU: the template-RNG
  # arc (stage_advance.cu:316-323) + the multi-emitter scene (an emissive sphere +
  # a 2-triangle area light) make CPU (mt19937 substream) and GPU (direct PCG32)
  # sample different light points, so lightPdf/bsdfPdf/wt differ by Monte-Carlo
  # variance, not error — the same reason the PostShade gate excludes bsdf_pdf.
  # The final-image SSIM gate is the sampling oracle for the sampled values.
  # power_heuristic_tol = 1e-5: the GPU computes wt in float32; recomputing from
  # the downloaded float32 pdfs in float64 differs by ~1e-7 (float32 rounding of
  # the divide+squares), so 1e-5 is a safe tight bound.
  PostNEE_MIS:
    power_heuristic_tol: 1.0e-5
    fields: ["path_light_pdf", "path_mis_pdf", "path_mis_weight"]
    note: "Pinned 2026-07-18 (pkg55-C2). Formula-parity gate: both CPU and GPU apply the Veach 1997 power heuristic identically to the pdfs they captured. Audit found no wavefront MIS bug; the omitted RGB two-sided bsdf_mis branch is intentional (one-sided spectral integrator). See pkg55-c2-mis-audit-research.md."

  # Final image: whole-image SSIM gate (unchanged from Phase B/C spec)
  final_image:
    ssim_visible: 0.985
    ssim_nir: 0.97
    scene: "pkg54 multiwavelength_parity"
    spp: 64
    note: "Phase B/C SSIM gate, unchanged. Visible band ≥0.985, NIR ≥0.97."

# Measurement scene for per-stage gates
# Use session_n1_envmap_cornell (7 materials, env-map miss) at 16x16, 1 spp
# for per-stage diff harness; use pkg54 multiwavelength_parity at 64 spp for
# final SSIM image gate.
measurement_protocol:
  per_stage_scene: "session_n1_envmap_cornell"
  per_stage_resolution: "16x16"
  per_stage_spp: 1
  per_stage_seed: 424242
  final_image_scene: "pkg54 multiwavelength_parity"
  final_image_spp: 64
  note: |
    Per-stage gates use a low-spp (1), small (16x16) render on the Session N+1
    comprehensive scene to localize divergence. Final SSIM gate uses the pkg54
    parity scene at 64 spp to validate whole-program correctness. The two are
    complementary: per-stage localization + whole-image validation.
