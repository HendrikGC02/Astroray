p removal + GPU roughReflectionEval frontFace; furnace CPU 0.9970-0.9987 / GPU 0.9987-1.0000; peak 0.45\u00b0; chi\u00b2 glass[0.3-45] stays xfail, owned by pkg150)", "group": "package"}, {"id": "pkg150-disney-dielectric-vndf-hemisphere-masking", "label": "pkg150", "num": "pkg150", "title": "pkg150 \u2014 Disney dielectric VNDF reflection candidate: same-hemisphere masking ki", "status": "5.1%** with sample()/pdf() agreement median rel err **0.0000** (N=300k), and the residual same-hemisphere delta fallback is only **0.16%** of samples. The spec's fix-contract option-1 (pbrt-v4 dead-sample) was implemented, built, and measured \u2014 it removes that 0.16% fallback but **regresses the high-roughness furnace** (r=1.0 CPU 0.997\u21920.788), the #517 trap, and moves chi\u00b2 only 2.4% because the chi\u00b2 gate is ~90% an ires=4 quadrature artifact (see closeout below). No code fix ships; the reverted fix is captured at `.astroray_plan/docs/pkg150-deadsample-fix.patch` for the follow-up multi-scatter-compensation spec. **Superseded history (pre-2026-08-02):** open \u2014 dispatchable behind pkg151/#519, pkg154/#521, pkg149/#522 (all merged); fix-contract item 1 baselined on the current main sampler.", "group": "package"}, {"id": "pkg151-rough-transmission-multiscatter-compensation", "label": "pkg151", "num": "pkg151", "title": "pkg151 \u2014 Rough-transmission multi-scatter energy compensation (unmasked by the p", "status": "The furnace-restoration gate is REMOVED from this package's scope \u2014 the stack premise is FALSIFIED** (the honestly pre-registered magnitude probe `.astroray_plan/docs/pkg151-glass-multiscatter-magnitude-notes.md` shows the Cycles glass compensation ceiling is ~1.03\u00d7 at ior=1.5 vs the 1.2\u00d7\u201311\u00d7 the deficit requires; with `670e583` stacked the furnace is statistically unchanged at 0.11\u20130.82). The deficit's true root cause is now owned by **pkg154** (investigation-first); the chi\u00b2 glass[0.3-45] un-xfail stays with pkg149, which stays HELD behind pkg154. What this package still delivers: the faithful cited port (CPU `roughTransmissionEval` + GPU twin), the glass LUT extraction, the GPU table-upload infrastructure, and the 9/9-tested trilinear sampler \u2014 all needed regardless of the root cause, all additive, main-sampler furnace unchanged-green (0.937\u20131.0). (Research confirmation record: `.astroray_plan/docs/pkg151-cycles-glass-tables-research.md`.)", "group": "package"}, {"id": "pkg152-gpu-disney-metal-residual-dimness", "label": "pkg152", "num": "pkg152", "title": "pkg152 \u2014 GPU Disney twin divergence: metal residual dimness + the low-roughness ", "status": "reconciliation now owned by pkg158** (filed 2026-07-25, the split-out follow-up; its Step 0 is the scene-controlled re-measure of both setups \u2014 until it reports, neither number is citable)). **RECONCILED 2026-08-02 (pkg158 Step 0, PR #535): Outcome A** \u2014 the 0.60-0.77 Symptom-(a) near-delta table below is SUPERSEDED (it was carried forward from pkg141 post-#518, not re-measured on the #523 build); re-measured on one build b036ac93 the near-delta reads 0.924-0.949 linear with no near-delta cliff, confirming the #523 verifier's ~1.0. Only a uniform ~5-8% GPU-dim (within [0.90,1.10], not near-delta-specific) remains. No code.", "group": "package"}, {"id": "pkg153-wavefront-diff-env-gates-disposition", "label": "pkg153", "num": "pkg153", "title": "pkg153 \u2014 wavefront_diff env-scene + perf gates: pre-existing FAIL on workstation", "status": "PRIORITY NOTE 2026-08-03 (owner-endorsed):** any remainder after the reviewer's disposition is sub-percent parity tail \u2014 DE-PRIORITIZED below the Integration Milestone alongside pkg173, unless the paper requires bit-level parity. The reviewer finishes its disposition; no new fix packages spawn from it ahead of the milestone. A disposition PR may ship during the 2026-07-24/25 overnight run ONLY if the root cause is proven to be stale machine-pinned baselines/thresholds (a re-pin with workstation evidence); if a real rendering regression is convicted, file a targeted fix spec \u2014 do NOT blind-fix or relax gates without conviction.", "group": "package"}, {"id": "pkg154-rough-transmission-furnace-deficit-root-cause", "label": "pkg154", "num": "pkg154", "title": "pkg154 \u2014 Rough-transmission furnace deficit under the corrected VNDF sampler: ro", "status": "Two convicted, unambiguous bugs**, both fixed and measured: (H1) `roughTransmissionEval`/`roughTransmissionPdf` derived enter/exit from `cosO>0` on the front-facing (ray-oriented) `rec.normal`, which is provably always `>=0` regardless of true enter/exit \u2014 measured 274,809/274,809 (100%) calls read `entering=true`, including the 61% that were genuine exit events; same bug class as the already-fixed `dielectric.cpp` frontFace bug, never ported here. (H4, new \u2014 not one of the spec's ranked H1-H3) a closure-level `clamp(0,4)` on the transmission eval, inconsistent with the file's own no-cap doctrine already documented for metal reflection (pkg123), truncated the low-roughness estimator's legitimate heavy tail. Together: furnace 0.11\u20130.82 -> **0.997\u20130.999** across roughness {0.05,0.1,0.3,0.6,1.0} on the pkg149+pkg151 stack, well inside [0.92,1.03]; peak alignment stays green; chi\u00b2 unchanged (pkg149's own gate, as expected). **Both fixes are measured no-ops on main's current sampler** (bit-identical furnace numbers with/without) \u2014 ships as a patch file (`.astroray_plan/docs/pkg154-frontface-and-clamp-fix.patch`), not a direct main PR, to avoid a disney.cpp merge conflict with the still-unmerged pkg151/PR #519 (same function). pkg149 should apply this patch alongside its own rebase once #519 merges. Full findings: `.astroray_plan/docs/pkg154-furnace-deficit-findings.md`.", "group": "package"}, {"id": "pkg155-gpu-absolute-slowdown-investigation", "label": "pkg155", "num": "pkg155", "title": "pkg155 \u2014 GPU render path ~5\u00d7 absolute slowdown since 2026-05 (investigation)", "status": "Phase 1 COMPLETE** (team-lead, 2026-07-25, RTX 5070 Ti @ `473c25b`, GPU lock; findings: `.astroray_plan/docs/pkg155-phase1-profile-findings.md`). The ~5\u00d7 is confirmed on the corrected metric (total GPU kernel-ms/render, since the spec's `ms/launch` headline is dead post-#524): cornell_diffuse 4.84\u00d7, cornell_glass 5.61\u00d7. **Shade stage convicted** \u2014 `wavefront_stage_shade_bucketed_n7` is 44\u201352% of GPU time at **221 regs/thread**, the only stage below 2 blocks/SM; recovery target **\u2264128 regs/thread**. **Phase 2 = the combined pkg153+pkg155 bisect: `.astroray_plan/docs/pkg153-pkg155-combined-bisect-protocol-2026-07-25.md`** (one build + ONE profiled GPU session per point serves both dispositions; **NOT GPU-free** \u2014 the register signal is runtime-profile-only, see the protocol's 2026-07-26 correction). **2026-07-26: the build-configuration lever is RULED OUT by measurement** \u2014 native sm_120 AOT is 1.68\u20131.80\u00d7 SLOWER at 229 regs, so the 221-register problem is intrinsic to the kernel (\u00a7Ruled out below; `.astroray_plan/docs/pkg155-sm120-negative-result.md`). Dispatchable; RTX-gated, serialize on the GPU lock.", "group": "package"}, {"id": "pkg156-wavefront-naive-bounce2-brightness-residual", "label": "pkg156", "num": "pkg156", "title": "pkg156 \u2014 Wavefront visible-naive ~1\u20131.5% deterministic brightness residual (boun", "status": "0.998 is unreachable; gate stays at 0.995**; the 0.998 restoration is BLOCKED-ON pkg172 (pointer updated 2026-08-02 from pkg168, once pkg168's decomposition exposed a distinct triangle-geometry mechanism pkg172 now owns; pkg153's R-drift is the shared mechanism, see-also). Escalated to the architect (contract point 3). Do NOT re-pin to 0.998 without pkg172's fix.", "group": "package"}, {"id": "pkg157-wavefront-firefly-clamp-port", "label": "pkg157", "num": "pkg157", "title": "pkg157 \u2014 Port pkg144 clampDirect/clampIndirect into the wavefront (restore the G", "status": "DONE** \u2014 merged as `b6c3ffb` (PR #526, 2026-07-26). RTX 5070 Ti verification: cross-binary clamps-off no-op measured at **2.48e-07 relative to peak** (image sums identical to 6dp), ~40x inside the 1e-5 wavefront MC convention; bounce classification proven directly \u2014 `clampIndirect` is EXACTLY inert (0.000000) at `max_depth=1` where no indirect bounces exist and bites (0.294769) at `max_depth=8`, with `clampDirect` depth-invariant at 1.511, which validates the parked-bounce lane for the deferred shadow-resolve. Gate run 8 passed / 1 documented skip at merge; the skip was the firefly-suppression clause, since **un-skipped and GREEN by pkg161** (`1393b13`) \u2014 full run now **12 passed**. Contract items 2 and 3 were formally amended on measured evidence (see Contract).", "group": "package"}, {"id": "pkg158-gpu-metal-remainder-reconciliation", "label": "pkg158", "num": "pkg158", "title": "pkg158 \u2014 GPU Disney metal remainder: reconcile the near-delta numbers, then fix ", "status": "done (PR #535, 2026-08-02 \u2014 Outcome A: near-delta discrepancy reconciled & superseded. Re-measured on one build b036ac93 [post-#518/#523/pkg160/pkg163]: near-delta Disney-metal GPU/CPU = 0.924\u20130.949 linear / 0.960\u20130.971 gamma, no near-delta cliff, all rows within the [0.90,1.10] close band. The 0.60\u20130.77 research-doc record is SUPERSEDED (does not reproduce); the #523 verifier's ~1.0 reading is confirmed within band. A mild uniform ~5\u20138% GPU-dim persists across ALL roughness (0.92\u20130.98, channel-ordered R>G>B) \u2014 within band, NOT near-delta-specific, flagged for architect. No code. See Step 0 results below.)", "group": "package"}, {"id": "pkg159-wavefront-cryptomatte-port", "label": "pkg159", "num": "pkg159", "title": "pkg159 \u2014 Port cryptomatte accumulation into the wavefront (restore GPU cryptomat", "status": "DONE** \u2014 merged as `78e0ae4` (PR #529, 2026-07-26). RTX 5070 Ti verification: 4 gates passed; cross-path Psyop IoU **0.964\u20130.984 against the 0.85 threshold**. That threshold was the one number never previously exercised cross-path (it was derived CPU-vs-CPU) and it holds with margin \u2014 and it demonstrably discriminates, because the GPU leg's values are distinct from the CPU leg's (0.9743 vs 0.9843); had GPU crypto not been written the buffers would be all-zero and IoU ~0, not 0.97. NOT verified and recorded as such: a true cross-binary RED run (the gate file depends on helpers this PR adds, and the standalone probe scene needs `bpy`), and addon-side pass packing of the GPU crypto buffers. Two gate amendments adjudicated in-spec rather than silently weakened.", "group": "package"}, {"id": "pkg160-gpu-plain-metal-multiscatter-omission", "label": "pkg160", "num": "pkg160", "title": "pkg160 \u2014 Plain `metal` is ~3.5\u00d7 (median ~7\u00d7) too dark on the GPU: `gpu_metal_eva", "status": "direction reversed by owner decision after Step 0: the CPU was fixed, not the GPU.** Step 0 proved the two E-table systems disagree 24.6\u00d7 in `E` / 1030\u00d7 in `Fms` and that the CPU held the wrong one. `MetalPlugin` now applies the same multiplicative Kulla & Conty compensation, off the same shipped Cycles tables, that `disney.cpp` has shipped since pkg60; `gpu_metal_eval` applies its exact GPU twin. Measured on CPU: the pre-fix conductor **created energy** (white furnace 1.25\u20131.77\u00d7 in linear space); post-fix 0.81\u20130.88. The runtime-MC `GGXEnergyCompensationLUT` + `ggxMultiScatterCompensation` are **deleted**. The plain-metal GPU/CPU parity gate landed in the same PR (`tests/test_pkg160_plain_metal_gpu_cpu_parity.py`, mean AND median, `[0.95, 1.05]`) and **has now run on RTX 5070 Ti: 31 passed, 1 documented exception** (roughness 0.9 channel B = 1.0722; owner-approved ceiling of 1.10 at r=0.9 only, floor unchanged, 2.6% headroom so real regressions still fail). That exception's cause \u2014 CPU per-wavelength vs GPU per-RGB-channel compensation \u2014 was confirmed experimentally and is **pre-existing architecture pkg160 exposed, not introduced**; a follow-up package is filed. See \"pkg160 REWORK\" and \"HW gate result\" at the end of this file. Original conviction (team-lead scene-controlled GPU scan, main @ `727a211`) stands.", "group": "package"}, {"id": "pkg161-firefly-bearing-gate-scene", "label": "pkg161", "num": "pkg161", "title": "pkg161 \u2014 Build a firefly-bearing gate scene (the test library has no high-varian", "status": "22.85\u00d7** (target \u226510\u00d7, 12.6\u00d7 heavier than the next-worst library scene at 1.82\u00d7); `metal_cornell` negative control **1.07\u00d7** (limit \u22643.0\u00d7, confirms the gate discriminates). 12 gates green; un-skips pkg157's `test_gpu_wavefront_clamp_indirect_suppresses_fireflies_without_energy_loss` (skipped since PR #526).", "group": "package"}, {"id": "pkg163-metal-spectral-compensation-colorspace-parity", "label": "pkg163", "num": "pkg163", "title": "pkg163 \u2014 GGX energy compensation computed in different colour spaces: CPU per-wa", "status": "done (PR #533, 2026-08-02 \u2014 b036ac9. Direction A shipped: GPU metal builds its spectral response per-wavelength via `gpu_metal_eval_spectral`. pkg160's r=0.9 `[0.95,1.10]` band exception retired, standard `[0.95,1.05]` restored at all roughnesses (mean+median, 0.9: R/G/B 1.0153/1.0171/1.0112). Chromatic spread 0.0025 seed-averaged, 2560 spp x 4 seeds, vs <=0.01 bound; initial single-seed 256-spp HW run FAILED at 0.0133, diagnosed as MC noise in the statistic and re-run with the 4-seed-averaged statistic (bound unchanged) \u2014 PASS. 7/7 gates green on RTX 5070 Ti.)", "group": "package"}, {"id": "pkg165-disney-metal-uniform-dim-residual", "label": "pkg165", "num": "pkg165", "title": "pkg165 \u2014 uniform ~5\u20138% Disney-metal GPU-dim residual at every roughness: localiz", "status": "the GPU-dim premise DOES NOT REPRODUCE on current main.** The pkg129 metal A/B (research doc `reflection-multiscatt ": "pkg55-wavefront-soa-refactor", "kind": "doc"}, {"source": "docs\\STATUS.md", "target": "pkg70-optix-denoiser-backend", "kind": "doc"}, {"source": "docs\\pkg106-forward-lighttracing-research.md", "target": "pkg106-sms-on-triangulated-prisms", "kind": "doc"}, {"source": "docs\\standup\\2026-07-23.md", "target": "pkg149-disney-dielectric-rough-transmission-sample-pdf", "kind": "doc"}, {"source": "docs\\pkg178-stage4-plan.md", "target": "pkg121-chi2-sampler-gates", "kind": "doc"}, {"source": "docs\\pkg122-light-energy-calibration-research.md", "target": "pkg122-dedicated-light-energy-calibration", "kind": "doc"}, {"source": "docs\\pkg168-upsampling-parity-step1.md", "target": "pkg163-metal-spectral-compensation-colorspace-parity", "kind": "doc"}, {"source": "docs\\standup\\2026-08-01-overnight.md", "target": "pkg155-gpu-absolute-slowdown-investigation", "kind": "doc"}, {"source": "docs\\2026-05-16-roadmap-orchestrator-design.md", "target": "pkg94-addon-build-integrity-guard", "kind": "doc"}, {"source": "docs\\production.md", "target": "pkg152-gpu-disney-metal-residual-dimness", "kind": "doc"}, {"source": "docs\\ROADMAP.md", "target": "pkg132-host-mapped-memory-fallback", "kind": "doc"}, {"source": "docs\\wavefront-gpu-research.md", "target": "pkg24-restir-validation", "kind": "doc"}, {"source": "docs\\STATUS.md", "target": "pkg56-incremental-scene-sync", "kind": "doc"}, {"source": "docs\\standup\\2026-07-25-dayrun.md", "target": "pkg149-disney-dielectric-rough-transmission-sample-pdf", "kind": "doc"}, {"source": "docs\\motion-blur-research.md", "target": "pkg73-optix-temporal-denoiser", "kind": "doc"}, {"source": "docs\\cryptomatte-research.md", "target": "pkg55-wavefront-soa-refactor", "kind": "doc"}, {"source": "docs\\production.md", "target": "pkg251-spectral-band-parameter-reachability", "kind": "doc"}, {"source": "docs\\standup\\2026-08-02.md", "target": "pkg163-metal-spectral-compensation-colorspace-parity", "kind": "doc"}, {"source": "docs\\STATUS.md", "target": "pkg68-oidn-architectural-fix", "kind": "doc"}, {"source": "docs\\pkg55-c7-day-arc-2026-07-25.md", "target": "pkg87b-cryptomatte-integrator-integration", "kind": "doc"}, {"source": "docs\\pkg178-stage4-plan.md", "target": "pkg119-blender-parity-program", "kind": "doc"}]};
let graph;

function statusColor(s){ s = (s||'').toLowerCase();
  if(s.indexOf('done')>=0) return '#3fb950';
  if(s.indexOf('progress')>=0 || s.indexOf('review')>=0) return '#d29922';
  if(s.indexOf('open')>=0) return '#58a6ff';
  return '#8b949e'; }
function nodeColor(n){ if(n.group==='doc') return '#bc8cff'; if(n.group==='file') return '#2ea043'; return statusColor(n.status); }
function nodeSize(n){ return n.group==='package' ? 2.2 : n.group==='doc' ? 1.7 : 1.0; }

// Cache of last-known node positions/velocities, keyed by id, so toggling a
// layer on/off doesn't teleport survivors and reheat the whole simulation
// (previously caused disconnected components to repel to infinity).
const posCache = {};

function cachePositions(){
  if(!graph) return;
  graph.graphData().nodes.forEach(n => {
    posCache[n.id] = {x:n.x, y:n.y, z:n.z, vx:n.vx, vy:n.vy, vz:n.vz};
  });
}

function build(){
  const show = g => document.getElementById(g).checked;
  const nodes = DATA.nodes.filter(n => (n.group==='package'&&show('t-package'))
    || (n.group==='doc'&&show('t-doc')) || (n.group==='file'&&show('t-file')));
  const ids = new Set(nodes.map(n=>n.id));
  const links = DATA.edges.filter(e => {
    if(!ids.has(e.source) || !ids.has(e.target)) return false;
    if(e.kind==='depends') return show('t-dep');
    if(e.kind==='doc') return show('t-dedge');
    return show('t-fedge');
  });
  // Re-use prior positions for nodes that survive the filter, so rebuilding
  // graphData() doesn't reset (and reheat) the whole layout.
  nodes.forEach(n => {
    const p = posCache[n.id];
    if(p){ n.x=p.x; n.y=p.y; n.z=p.z; n.vx=p.vx; n.vy=p.vy; n.vz=p.vz; }
  });
  return {nodes, links};
}

function render(){
  cachePositions();
  const d = build();
  if(!graph){
    graph = ForceGraph3D()(document.getElementById('3d-graph'))
      .graphData(d)
      .nodeId('id')
      .nodeLabel(n => n.title || n.label)
      .nodeColor(nodeColor)
      .nodeVal(nodeSize)
      .nodeRelSize(4)
      .linkColor(l => l.kind==='depends' ? 'rgba(88,166,255,0.9)' : l.kind==='doc' ? 'rgba(188,140,255,0.85)' : 'rgba(46,160,67,0.55)')
      .linkWidth(l => l.kind==='depends' ? 1.6 : l.kind==='doc' ? 1.4 : 0.6)
      .linkDirectionalParticles(l => l.kind==='file' ? 0 : 2)
      .linkDirectionalParticleWidth(1.6)
      .linkDirectionalParticleSpeed(0.004)
      .linkDirectionalArrowLength(l => l.kind==='file' ? 0 : 3.5)
      .linkDirectionalArrowRelPos(1)
      .backgroundColor('#0d1117')
      .showNavInfo(false)
      .d3VelocityDecay(0.35)
      .warmupTicks(60)
      .cooldownTicks(200)
      .onNodeHover(n => { document.getElementById('3d-graph').style.cursor = n ? 'pointer' : 'default'; })
      .onNodeClick(n => {
        const dist = 28; const deg = graph.cameraPosition();
        graph.cameraPosition({x:n.x, y:n.y, z:n.z + dist}, {x:n.x, y:n.y, z:n.z}, 1200);
      });
    // Tune the force sim: bounded charge (repulsion decays past distanceMax so
    // disconnected components don't fly apart forever), a fixed link distance,
    // and a centering force so everything stays anchored near the origin.
    graph.d3Force('charge').strength(-140).distanceMax(450);
    graph.d3Force('link').distance(l => l.kind==='file' ? 16 : 42);
    if(graph.d3Force('center')) graph.d3Force('center').strength(1);
  } else {
    // Positions were preserved above, so only a light re-settle is needed —
    // NOT a full reheat, which is what caused the infinite-drift bug.
    graph.cooldownTicks(40);
    graph.graphData(d);
  }
}

function setDimensions(is2D){
  cachePositions();
  graph.numDimensions(is2D ? 2 : 3);
  if(is2D){
    // Flatten cached z so nodes don't have to fight their way back to a plane.
    Object.values(posCache).forEach(p => { p.z = 0; p.vz = 0; });
    graph.graphData().nodes.forEach(n => { n.z = 0; n.vz = 0; });
  }
  graph.cooldownTicks(120);
  graph.d3ReheatSimulation();
}

document.querySelectorAll('#panel input[type=checkbox]:not(#t-2d)').forEach(cb => cb.addEventListener('change', render));
document.getElementById('t-2d').addEventListener('change', e => setDimensions(e.target.checked));
render();
</script>
