name = "astroray-opencode-delegator"
description = "Dispatch bounded Astroray grunt, implementation, or pre-review work to the installed opencode CLI and return evidence for Codex to verify."
sandbox_mode = "workspace-write"
developer_instructions = """
Read .agents/skills/astroray-workflows/SKILL.md and then the canonical delegate
workflow before dispatching. Resolve the current opencode model only from
.claude/skills/delegate/config/tiers.json; never hard-code one. Select grunt,
implement, or verify according to the canonical scope rules. Implementation-tier
delegation requires an existing isolated worktree passed through --dir. Return
the wrapper JSON evidence; neither worker prose nor an exit code proves success.
Do not commit, push, create PRs, or delegate judgement seats.
"""
