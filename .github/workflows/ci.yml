name: CI

on:
  push:
  pull_request:

# A newer push to the same ref supersedes any in-flight run — cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect whether the change touches code at all. Doc/planning-only pushes
  # (56% of recent runs, ~17 min each) skip the compile matrix. Job-level
  # skip (not trigger-level paths-ignore) so required checks report
  # "skipped" — which satisfies branch protection — instead of hanging
  # "pending" forever.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # every: a changed file counts as "code" only if it matches ALL
          # patterns below (i.e., is outside every excluded doc/config area).
          predicate-quantifier: every
          filters: |
            code:
              - '!.astroray_plan/**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.opencode/**'

  build-and-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpython3-dev libomp-dev

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j4

      - name: Cache PractRand
        id: practrand-cache
        uses: actions/cache@v4
        with:
          path: third_party/PractRand
          key: practrand-e4caf7fda98b2c597bbda3b576753cf5a0f6047aab837c82be370ab798a672e1

      - name: Build PractRand
        if: steps.practrand-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          cd third_party
          curl -L -o PractRand.zip "https://sourceforge.net/projects/pracrand/files/PractRand_0.96.zip/download"
          echo "e4caf7fda98b2c597bbda3b576753cf5a0f6047aab837c82be370ab798a672e1  PractRand.zip" | sha256sum -c - || exit 1
          unzip -q PractRand.zip
          cd PractRand
          g++ -c src/*.cpp src/RNGs/*.cpp src/RNGs/other/*.cpp -O3 -Iinclude
          ar rcs PractRand.a *.o
          g++ -o RNG_test tools/RNG_test.cpp PractRand.a -O3 -Iinclude -Itools -pthread

      - name: Test
        run: python -m pytest tests/ -v

      - name: Reference bank smoke
        # Informational only: pytest above (tests/test_reference_bank_smoke.py)
        # is the authoritative gate. This step renders cornell-mini end-to-end
        # against the pinned PNG reference and reports the diff for human review,
        # but is allowed to fail because cross-platform MC noise (Windows vs
        # Linux RNG ordering, OpenMP thread interleave) can shift the SSIM/ΔE
        # measurement below the pinned threshold without indicating a real
        # regression in the renderer's behaviour.
        continue-on-error: true
        run: |
          python -m benchmarks.reference_bank.runner --mode smoke

  spec-lint:
    # No `needs: changes` — package specs are the thing this job checks, and
    # the `changes` job's paths-filter excludes .astroray_plan/** entirely,
    # so a spec-only push would otherwise skip this gate. Independent of the
    # compile matrix; stdlib-only, no build step.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint package specs against TEMPLATE v2
        run: python scripts/project_index.py lint --all

  cuda-syntax-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: 'network'
          # Use default sub-packages for network method (includes nvcc + essential libs/headers)
          # Trying to cherry-pick sub-packages hits missing dependencies (curand, nvtx headers)

      - name: Verify CUDA installation
        run: |
          nvcc --version
          echo "CUDA_PATH=$CUDA_PATH"

      - name: Compile CUDA sources (syntax check)
        run: |
          set -e

          # Find all .cu files, excluding neural_cache.cu (requires tiny-cuda-nn opt-in dependency)
          cuda_files=$(find src -type f -name "*.cu" | grep -v "neural_cache.cu")

          echo "=== CUDA files found ==="
          echo "$cuda_files"
          echo ""

          # Compile each .cu file with -c (compile only, no linking), 4 at a
          # time (runner has 4 vCPUs; was a serial for-loop before 2026-08).
          # Using -arch=sm_75 (Turing baseline) for broad compatibility.
          # xargs exits non-zero if any child fails; per-file OK/ERROR lines
          # keep failures attributable in the interleaved log.
          echo "$cuda_files" | xargs -P 4 -I{} bash -c '
            if nvcc -c "{}" \
              -std=c++17 \
              -arch=sm_75 \
              -I include \
              -I src \
              -I . \
              -I "$CUDA_PATH/include" \
              --expt-relaxed-constexpr \
              --extended-lambda \
              -rdc=true \
              -Wno-deprecated-gpu-targets \
              -o "/tmp/$(basename "{}" .cu).o" 2>&1; then
              echo "OK: {} compiled successfully"
            else
              echo "ERROR: Failed to compile {}"
              exit 1
            fi'

          echo "=== All CUDA files compiled successfully ==="
