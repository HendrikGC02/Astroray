name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpython3-dev libomp-dev

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j4

      - name: Build PractRand
        run: |
          mkdir -p third_party
          cd third_party
          curl -L -o PractRand.zip "https://sourceforge.net/projects/pracrand/files/PractRand_0.96.zip/download"
          echo "e4caf7fda98b2c597bbda3b576753cf5a0f6047aab837c82be370ab798a672e1  PractRand.zip" | sha256sum -c - || exit 1
          unzip -q PractRand.zip
          cd PractRand
          g++ -c src/*.cpp src/RNGs/*.cpp src/RNGs/other/*.cpp -O3 -Iinclude
          ar rcs PractRand.a *.o
          g++ -o RNG_test tools/RNG_test.cpp PractRand.a -O3 -Iinclude -Itools -pthread

      - name: Test
        run: python -m pytest tests/ -v

  cuda-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Verify CUDA installation
        run: |
          nvcc --version
          echo "CUDA_PATH=$CUDA_PATH"

      - name: Compile CUDA sources (syntax check)
        run: |
          set -e

          # Find all .cu files, excluding neural_cache.cu (requires tiny-cuda-nn opt-in dependency)
          cuda_files=$(find src -type f -name "*.cu" | grep -v "neural_cache.cu")

          echo "=== CUDA files found ==="
          echo "$cuda_files"
          echo ""

          # Compile each .cu file with -c (compile only, no linking)
          # Using -arch=sm_75 (Turing baseline) for broad compatibility
          failed=0
          for cu_file in $cuda_files; do
            echo "=== Compiling $cu_file ==="
            if ! nvcc -c "$cu_file" \
              -std=c++17 \
              -arch=sm_75 \
              -I include \
              -I src \
              -I "$CUDA_PATH/include" \
              --expt-relaxed-constexpr \
              -Wno-deprecated-gpu-targets \
              -o "/tmp/$(basename "$cu_file" .cu).o" 2>&1; then
              echo "ERROR: Failed to compile $cu_file"
              failed=1
            else
              echo "OK: $cu_file compiled successfully"
            fi
            echo ""
          done

          if [ $failed -eq 1 ]; then
            echo "=== CUDA syntax check FAILED ==="
            exit 1
          fi

          echo "=== All CUDA files compiled successfully ==="
