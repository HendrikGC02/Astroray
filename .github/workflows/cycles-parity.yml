name: Cycles Parity Benchmark

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      scenes:
        description: "Comma-separated scene ids, default full matrix"
        required: false
        default: ""
      engines:
        description: "Comma-separated engine ids, default full matrix"
        required: false
        default: ""
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cycles-parity:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/benchmark cycles-parity'))
    runs-on: [self-hosted, cuda, cycles]
    steps:
      - uses: actions/checkout@v4

      - name: Select benchmark subset
        id: subset
        shell: bash
        run: |
          scenes="${{ github.event.inputs.scenes || '' }}"
          engines="${{ github.event.inputs.engines || '' }}"
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            scenes="cornell,classroom"
            engines=""
          fi
          scene_args=""
          engine_args=""
          IFS=',' read -ra scene_items <<< "$scenes"
          for item in "${scene_items[@]}"; do
            [[ -n "$item" ]] && scene_args="$scene_args --scene $item"
          done
          IFS=',' read -ra engine_items <<< "$engines"
          for item in "${engine_items[@]}"; do
            [[ -n "$item" ]] && engine_args="$engine_args --engine $item"
          done
          echo "scene_args=$scene_args" >> "$GITHUB_OUTPUT"
          echo "engine_args=$engine_args" >> "$GITHUB_OUTPUT"

      - name: Validate scene manifest
        run: python benchmarks/cycles-parity/scenes/scripts/fetch_scenes.py --dry-run

      - name: Run benchmark
        shell: bash
        run: |
          python scripts/run_parity.py ${{ steps.subset.outputs.scene_args }} ${{ steps.subset.outputs.engine_args }}
          latest="$(ls -t benchmarks/cycles-parity/*.csv | head -n 1)"
          python scripts/summarize_parity.py "$latest" --output "${latest%.csv}.md"

      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: cycles-parity
          path: |
            benchmarks/cycles-parity/*.csv
            benchmarks/cycles-parity/*.md
