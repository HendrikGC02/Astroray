# Scene metadata for the Cycles-parity benchmark (pkg71).
#
# The downloadable Blender Foundation demo scenes (Classroom, BMW27, Junkshop,
# UDIM_monster) were REMOVED 2026-06-08: they ship from old Blender versions,
# load/render incorrectly under current Blender/Cycles, and the Classroom
# reference render was broken. The only remaining parity scene is the
# self-authored `cornell` (defined directly in scripts/run_parity.py, not here).
#
# To re-introduce a demo scene in future, add a [[scene]] block here with a
# pinned sha256 and a current-Blender-rendered reference EXR. Archives download
# into scenes/cache/ (gitignored) via scenes/scripts/fetch_scenes.py.
#
# pkg265 — glass_sphere is self-authored (no "url"/"archive"/"sha256": nothing
# to download, no fetch_scenes.py entry needed) and committed directly at
# scenes/glass_sphere.blend, not scenes/cache/ (run_parity.py's
# _find_blend_path checks scenes/<id>.blend first). Its parity row is a
# RECORDED cross-check, not a gate. #779: `astroray_leg = "addon"` renders
# the Astroray legs through headless Blender + the addon's full translation
# (scripts/run_parity.py -> benchmarks/blender_parity/render_leg.py
# --load-blend), so the row compares real glass against Cycles glass. The
# default leg for .blend rows stays tools/blend_import (pkg76, Base Color
# only). The gated glass oracle remains
# benchmarks/cycles-parity/metal_ab/harness.py --material glass (pkg263).

[[scene]]
id = "glass_sphere"
name = "Glass Sphere (pkg265)"
author = "Astroray"
license = "self-authored"
reference_spp = 128
resolution = [256, 256]
astroray_leg = "addon"
attribution = "pkg265 native-Principled rough-glass IOR 1.45 sweep (roughness 0.5/0.85/1.0, three spheres); self-authored, no external asset. Astroray legs render through the addon (#779)."
