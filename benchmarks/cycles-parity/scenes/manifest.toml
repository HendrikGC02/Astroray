# Scene metadata for pkg71. Downloaded archives live in scenes/cache/ and are
# intentionally not committed. SHA-256 values set to "pending" are refused by
# the fetcher unless --allow-unpinned is passed; pin them after the first
# audited download from the canonical source.

[[scene]]
id = "classroom"
name = "Classroom"
author = "Christophe Seux"
license = "CC0-1.0"
url = "https://download.blender.org/demo/test/classroom.zip"
sha256 = "pending"
archive = "classroom.zip"
reference_spp = 300
resolution = [1920, 1080]
attribution = "Classroom by Christophe Seux, CC0-1.0, https://download.blender.org/demo/test/classroom.zip"

# Monster (UDIM_monster.blend) was dropped in pkg76 — it ships as a paint /
# UDIM rig without a render camera, and Cycles itself errors on it with
# "RuntimeError: Error: Cannot render, no camera". The four-scene set
# (Cornell + Classroom + Junkshop + BMW27) covers indoor lighting, dense
# props, and HDRI studio; a hero-render replacement is a future package.
# See pkg76 spec §"Monster Scene Decision".

