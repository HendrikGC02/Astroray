# disney-sweep-cycles-compared — Disney BSDF grid, Cycles reference
# Reference rendered by Cycles 5.1 via cycles_bless.py.
# Astroray-vs-Cycles measured progression:
#   2026-05-27: SSIM 0.48 (mismatched exposures) -> 0.61 (intensity calibration)
#   2026-05-31: SSIM 0.7611 after the sensor_fit=VERTICAL FOV fix (PR #405) was
#               applied to the re-rendered reference (camera framing now aligns;
#               residual gap is real cross-engine BSDF-implementation difference).
#
# Threshold is set below the current measured value with headroom: this gate
# catches further regressions from today's baseline, not "Astroray exactly
# matches Cycles." Tuning the exposure / lens / light-units mapping is a
# separate calibration pass.

[scene]
description = "Disney 3x3 sphere grid: roughness × metallic. Reference is Cycles 5.1's render of the same scene (rebuild via `cycles_bless.py`). Gate measures Astroray-vs-Cycles SSIM agreement."
bless_source = "cycles"

[[gate]]
type = "ssim"
threshold = 0.65
direction = "ge"
description = "Astroray-vs-Cycles SSIM. Measured 0.7611 on 2026-05-31 after the sensor_fit=VERTICAL FOV fix (PR #405) was applied to the re-rendered Cycles reference (framing now lines up; previously 0.61 with the pre-FOV-fix reference). Threshold 0.65 leaves ~0.11 headroom for MC/cross-platform noise while catching a framing/exposure regression. pHash is intentionally NOT used here because Astroray vs Cycles produce perceptually-different renders by construction (different tonemap, light units, BSDF implementation)."
