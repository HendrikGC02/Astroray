# glass-sphere-caustic — refractive focusing caustic (pkg110 forward light-tracer).
# Forward light-tracer (light_tracer_caustic); reference blessed 2026-05-30.
# 512x512, 96 spp, seed 17, caustic baked from 24M photons (near-deterministic).
# Measured baselines on the blessed reference:
#   peak luma / floor-median luma (concentration) = 3.91   (peak 1.0, floor 0.256)
#   bright_coverage L>0.5 in caustic ROI [176:336,170:330] = 0.0207
#   whole-frame fraction L>0.5 = 0.0021  (the bright pixels are 39x concentrated
#                                         in the ROI vs the frame — a real focus)
# The caustic core sits at ~(y=256, x=250). A non-focusing regression (broken
# refraction / no deposit) collapses the ROI coverage toward 0.

[scene]
description = "Clear ior-1.5 glass sphere + collimated sun focused by the pkg110 forward light-tracer into a concentrated 'burning-glass' caustic ring on a dim-lit floor. The primitive sphere is a non-triangle caustic caster the old 2-face prism code could not handle. Camera zoomed onto the focal spot."

[[gate]]
type = "bright_coverage"
threshold = 0.008
direction = "ge"
roi = [176, 336, 170, 330]
luminance_threshold = 0.5
description = "Concentration / focus-presence gate. Fraction of the caustic-landing ROI driven bright (L>0.5) by the focused cone. Measured 0.0207; the loose floor (0.008) gives MC-noise headroom while collapsing to ~0 if the refractive focus regresses. (No `concentration` metric exists in the runner; a tight high-luminance ROI is the equivalent peak/median proxy — the same bright_coverage pattern the prism + sms caustic scenes use.)"

[[gate]]
type = "ssim"
threshold = 0.93
direction = "ge"
description = "Layout/appearance regression vs the blessed reference. The caustic is baked at a fixed photon seed so the render is near-deterministic; a tight floor (cf. prism-bk7 0.95) is safe and catches a shifted/dimmed/spread focus. Slight slack vs the prism allows for the 96-spp camera-pass MC noise on the lit floor."

[[gate]]
type = "phash"
threshold = 12
direction = "le"
description = "Perceptual-hash structural backstop: the focused-spot-on-floor composition must stay recognizable (SSIM alone can be lenient on a dark, mostly-uniform frame)."
