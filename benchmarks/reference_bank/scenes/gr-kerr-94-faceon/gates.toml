# gr-kerr-94-faceon — Kerr a/M=0.94 with thin disk, lensing a structured grid sky
# (512^2, 64 spp). Re-blessed 2026-05-30 (design doc, owner feedback #1).
# Paired with gr-schwarzschild: same grid + same shadow, plus a bright disk ring.
# Measured baselines:
#   bright_coverage (L>0.3) = 0.27  (disk photon ring + bright lensed grid lines)
#   dark_disk fraction (L<0.05) = 0.053  (the BH shadow)
#   pHash distance vs gr-schwarzschild = 18 (the disk ring keeps the pair distinct)
#   same-seed SSIM (gate render vs reference, fixed SEED=17) = 1.0 (deterministic)
# pkg281 (2026-09-25): spin is now honoured (Kerr geodesics). The view is exactly
# equatorial, so the shadow is the Bardeen D-shape: prograde (flat) edge on image
# right at ~33 px, retrograde edge on the left at ~89 px (GYOTO 34 / 87 px). The two
# ROI dark_disk gates below lock that asymmetry; Schwarzschild gives 67/66 px and
# fails both. reference.png must be re-blessed on the canonical build.

[scene]
description = "Kerr a/M=0.94, Novikov-Thorne thin disk, gravitationally lensing a high-contrast equirectangular grid sky. Visible: a crisp central shadow, a bright photon-sphere ring (lensed disk emission) hugging it, and the background grid bending into concentric Einstein-ring arcs. The distinguished partner of gr-schwarzschild (same grid + shadow, but the bright disk ring is absent there) — exercises the Kerr metric plugin + disk-emission dispatch and keeps the pair pHash-distinct."

[[gate]]
type = "ssim"
threshold = 0.96
direction = "ge"
description = "Tight SSIM on the detail-rich lensed-grid + disk-ring frame. The gate render shares the reference's fixed SEED=17 (same-seed SSIM=1.0); 0.96 leaves headroom while catching a structural lensing/disk regression."

[[gate]]
type = "bright_coverage"
threshold = 0.18
direction = "ge"
luminance_threshold = 0.3
description = "Lensed-disk + bright-grid presence gate. Measured 0.27; threshold gives ~50% headroom. If GR lensing breaks the disk + bright structure collapse and this trips."

[[gate]]
type = "dark_disk"
threshold = 0.03
direction = "ge"
luminance_threshold = 0.05
description = "Shadow presence gate. Measured 0.053; ~40% headroom. The disk ring surrounds but does not fill the shadow, so the dark core persists."

[[gate]]
type = "phash"
threshold = 12
direction = "le"
description = "Structural self-stability gate. Tightened from 20 to 12 now that the lensed grid + disk ring give the frame rich perceptual structure."

[[gate]]
type = "dark_disk"
threshold = 0.9
direction = "ge"
luminance_threshold = 0.05
roi = [250, 262, 172, 184]
description = "pkg281 Kerr retrograde edge: 72-84 px left of centre lies inside the a=0.94 shadow (edge ~89 px, GYOTO 87). Schwarzschild (67 px) measures 0.007 here."

[[gate]]
type = "dark_disk"
threshold = 0.1
direction = "le"
luminance_threshold = 0.05
roi = [250, 262, 296, 312]
description = "pkg281 Kerr prograde edge: 40-56 px right of centre lies outside the flattened a=0.94 shadow (edge ~33 px, GYOTO 34). Schwarzschild (66 px) measures 1.0 here."