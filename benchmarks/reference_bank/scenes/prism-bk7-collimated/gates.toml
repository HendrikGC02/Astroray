# prism-bk7-collimated — triangulated BK7 prism rainbow caustic (pkg106 finish).
# Forward light-tracer (light_tracer_caustic); reference re-blessed 2026-05-30.
# Frame is now 512x512 (was 384x288) and the camera is zoomed tight onto the band.
# The continuous red->violet band fills the central frame: roughly y[40,460] x[110,400].
# Measured baselines (deterministic — baked caustic, fixed photon seed).

[scene]
description = "Triangulated equilateral BK7 prism + collimated sun + white floor. A forward light-tracer deposits per-wavelength refracted light on the floor, producing a clean continuous red->violet rainbow band (no salt-and-pepper chromatic noise)."

[[gate]]
type = "hue_spread"
threshold = 0.7
direction = "ge"
roi = [60, 460, 120, 390]
luminance_threshold = 0.1
saturation_floor = 0.04
description = "Rainbow-presence: full red->violet hue spread in the band ROI (pkg106 acceptance >= 0.7)."

[[gate]]
type = "bright_coverage"
threshold = 0.5
direction = "ge"
roi = [60, 460, 120, 390]
luminance_threshold = 0.1
description = "Band-continuity discriminator: a real continuous band fills its ROI. Salt-and-pepper chromatic noise — which also scores high hue_spread — collapses this well below 0.5."

[[gate]]
type = "ssim"
threshold = 0.95
direction = "ge"
description = "Layout/appearance regression vs the blessed prism reference (render is near-deterministic, so a tight floor is safe)."
