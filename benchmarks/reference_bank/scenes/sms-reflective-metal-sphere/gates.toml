# sms-reflective-metal-sphere — reflective caustic (concave coffee-cup)
# Reference re-blessed 2026-05-27 after owner feedback (convex sphere
# was wrong — needed concave). Now a triangulated polished-metal
# cylinder (coffee-cup interior) with side rim light.

[scene]
description = "Coffee-cup-interior concave reflector + side-mounted area emitter. Light bounces off curved inside walls and focuses as a visible caustic crescent on the opposite inside wall. Tests the SMS reflective branch under concave geometry."

[[gate]]
type = "ssim"
threshold = 0.82
direction = "ge"

[[gate]]
type = "delta_e_2000"
threshold = 6.0
direction = "le"

[[gate]]
type = "bright_coverage"
threshold = 0.05
direction = "ge"
roi = [80, 256, 50, 320]
luminance_threshold = 0.10
description = "Caustic-presence gate. Inside-cup ROI; if caustic-finding regresses (SMS reflective branch breaks), bright-region coverage collapses."

[[gate]]
type = "phash"
threshold = 16
direction = "le"
