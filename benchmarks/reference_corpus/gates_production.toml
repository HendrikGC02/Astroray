blender = "5.2.0 LTS"
seed = 278
mc_seeds = [278, 279, 280, 281, 282]
adaptive_sampling = false
denoise = false
band_floor = 0.02
blessed_on = "Cycles references: Blender 5.2.0 LTS; bands: 5 seeds, Cycles + Astroray CPU spread, base commit e15622cb, pkg310"

