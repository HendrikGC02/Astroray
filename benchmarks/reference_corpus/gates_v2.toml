blender = "5.2.0 LTS"
seed = 278
mc_seeds = [278, 279, 280]
adaptive_sampling = false
denoise = false
band_floor = 0.02
blessed_on = "Cycles references: Blender 5.2.0 LTS, base commit 1a0cf783, pkg284 Phase 1"

