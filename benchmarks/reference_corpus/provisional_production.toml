# ---- documented divergences (pkg327 Phase B) -----------------------------------------------------------------
# Spectral transport of a saturated albedo under coloured light: a grey albedo removes each shift (`albedo_grey`), and
# Mitsuba 3 spectral reproduces it on the smooth-HDRI proxies of the same ROIs. `channels` are pinned to the Astroray
# 5-seed mean (278 1301 2711 4177 6113, build e302ca1, 64 spp) with pin_tol = max(0.02, 3*sigma*sqrt(1.2)); the other
# channels of the ROI stay on Cycles. Calibration: `mc_tolerance.py --suite production --legs cpu gpu` (see README.md).
# Attribution: .astroray_plan/docs/pkg327-chroma-residual-attribution.md ("Per-channel verdicts"); arbitration artefact:
# .astroray_plan/docs/pkg327-attribution/proxy_smooth_hdri.json. Proxy figures: Mitsuba spectral/rgb (Ms/Mr) and
# Astroray/Cycles (A/C) on the proxy of the same ROI, smooth HDRI.

