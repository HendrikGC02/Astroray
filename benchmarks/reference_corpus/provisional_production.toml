# ---- Cycles reference variants (#995, owner 2026-10-31) -------------------------------------------------------
# `mc_tolerance.py` passes the control to the Cycles legs ONLY (reference EXR and band sigma) as render_leg `--attrib-spec`;
# the Astroray legs render the .blend as authored. The EXR's receipt (n read from the scene, scale) is the sidecar
# production/refs/<scene>_cycles.json, and gates_production.toml names the variant on the scene (`reference_variant`).
[[reference_control]]
scene = "prod_shader_stack"
issue = "#995"
kind = "emission_backface_scale"
material = "ShaderStack"
reason = "Astroray keeps the radiance 1/eta^2 on light crossing the glass boundary (pbrt-v4 radiance mode, Veach thesis 5.2) and Cycles has none, so emission inside the glass reads 1/n^2 darker in Astroray. The reference scales the Emission strength by 1/n^2 on back-facing (inside-the-shell) hits, n = the Glass BSDF IOR. Front-face emission and every other channel stay as Cycles renders them"

