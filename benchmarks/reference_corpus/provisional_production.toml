reason = "#1237: pbr_group right ROI, 12/16 at seed 278 (build 000cd943): r 1.182 g 1.280 b 1.286 L 1.234 from ONE camera sample, luminance 1397 at pixel (194,145) (+0.243 of the ROI mean; without it L 0.992). Traced, a legitimate rare path: first hit on a normal-map tile edge (roughness 0.25), environment NEE into the HDRI sun, power-heuristic weight 0.950 (light pdf 43.1, BSDF pdf 9.85; Cycles light_sample_mis_weight_nee, the reference has no clamp). The 1024 spp Cycles reference has same-class events at (196,145) and (198,146) at a matching rate, about 1 per 20 renders at 64 spp in this ROI. 12-seed CPU right L median 0.983. The rows above the glint line read 0.966 of Cycles on CPU and GPU alike, about 1.2 points of it the nearest-sampled base / metal / roughness images (Cycles Closest A/B; pkg234). pkg327 Phase B pinned lower b (spectral, Mitsuba-confirmed; CPU 0.925)"

