# pkg310 hand-maintained gate exceptions for the production node-tree corpus (NOT generated).
# Each [[row]] is a strict xfail on one (material, backend, kind) test in tests/test_production_corpus.py, tied to
# the issue of its PRIMARY root cause (the full cause list is in the reason and in
# .astroray_plan/docs/pkg310-production-corpus-burndown.md). The fixing PR deletes the row (memory
# xfail-gated-features-must-unxfail). kind = "parity" (some ROI channel outside its MC band) or "silent"
# (silent_drop_audit finds an exercised pair that is neither SUPPORTED in the coverage matrix nor reported).
# Measured 2026-09-30, seed 278, Astroray CPU + GPU on the pkg298 CUDA build (main a84204d9 content) with the
# matching addon Python; Cycles 5.2.0 LTS references.
# [[divergence]] rows (Astroray physically right, Cycles differs; owner 2026-09-29) pin an ROI against
# Astroray's own mean. None is needed yet: every failure below is an Astroray gap, not a Cycles quirk.

